model_list:
  # Free path using Google AI Studio (Gemini API). No billing account required.
  #
  # Verified against a live key: gemini-3.5-flash responds on the free tier.
  # The challenge's other model, gemini-3.5-flash-lite, does not exist - the
  # Flash-Lite line is at 3.1, so that is used for the cheap tier.
  #
  # Tier boundaries are left at the shipped defaults (0.15 / 0.35 / 0.60).
  #
  # Measured with POST /auto_router/test_routing: this benchmark scores
  #   simple -0.1   short_explanation -0.1   architecture 0.0   tradeoff 0.175
  # so only tradeoff clears simple_medium (0.15) and lands in MEDIUM. Default and
  # lowered boundaries both produced identical 1/4 tier accuracy, so boundary
  # tuning is not the lever here. MEDIUM maps to the cheap tier by design, which
  # is why tradeoff is served by Flash-Lite.
  #
  # Lowering simple_medium below 0.0 would push "architecture" out of SIMPLE, but
  # that would be fitted to four prompts and would treat the scorer's noise floor
  # as signal. Remapping MEDIUM to the strong model is likewise rejected: it sends
  # every MEDIUM request to the expensive tier and defeats the cost objective.
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Complexity router using LiteLLM's built-in heuristic scorer.
  # Same aliases and tiers across every config, so benchmark.py measures the
  # same thing on each path.
  - model_name: jev-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: gemini-flash
      complexity_router_config:
        # Interim operating point at threshold t = -0.075.
        #
        # Only t changes a routing decision: SIMPLE and MEDIUM both map to the
        # cheap model, and COMPLEX and REASONING both map to the strong one. The
        # mapping below therefore keeps boundaries ordered while making SIMPLE
        # mean "scored below t", which the offline curve selected by fewest
        # under-routed prompts.
        #
        # This is an INTERIM choice, not a validated one. On the 60-prompt set it
        # sends 40/60 prompts to Flash, i.e. close to default-strong pricing, and
        # the length-confound test (eval/prompts_2x2.yaml) has not been run yet.
        tier_boundaries:
          simple_medium: -0.075
          medium_complex: 0.35
          complex_reasoning: 0.60
        tiers:
          SIMPLE: gemini-flash-lite
          MEDIUM: gemini-flash
          COMPLEX: gemini-flash
          REASONING: gemini-flash
        classifier_type: heuristic
        classifier_fallback: heuristic
        classifier_context_window_size: 3
        classifier_context_budget_chars: 8000
        classifier_context_include_assistant_turns: false
        return_raw_model_name: true
        # No custom_technical_keywords here, deliberately.
        #
        # A candidate list (event-driven, idempotency, observability, pipeline,
        # retries, ordering, failure isolation, synchronous, latency, tradeoff) was
        # tried and every term had support in exactly ONE tuning prompt, because
        # the list was derived from the benchmark prompts themselves. That is
        # training on the test set. tools/check_keywords.py enforces a guard of
        # support >= 3 tuning prompts and no held-out presence; all 12 candidates
        # fail it, so none are configured. Re-derive any keyword list from a
        # larger corpus before adding entries here.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
