model_list:
  # Free path using Google AI Studio (Gemini API). No billing account required.
  #
  # Verified against a live key: gemini-3.5-flash responds on the free tier. The
  # source project's other model, gemini-3.5-flash-lite, does not exist - the
  # Flash-Lite line is at 3.1, so that is used for the cheap tier.
  #
  # TIER MAP AND BOUNDARIES ARE DELIBERATELY THE SHIPPED DEFAULTS.
  #
  # Every measured result in the README was taken with this map
  # (SIMPLE and MEDIUM -> cheap, COMPLEX and REASONING -> strong) and these
  # boundaries (0.15 / 0.35 / 0.60). tools/evaluate_router.py and
  # tools/test_routing.py hardcode the same map, so changing either side
  # silently makes the other wrong. Keep them in step.
  #
  # An interim operating point of simple_medium=-0.075 with MEDIUM routed to the
  # strong model was tried and reverted. It was chosen on the pooled scores, which
  # means it was fitted rather than validated, and it sends 40 of 60 prompts to
  # the strong model - close to default-strong pricing, which is not routing. The
  # offline threshold sweep showed no threshold separates hard from easy prompts
  # at all, so there is no operating point worth adopting here.
  #
  # Measured with POST /auto_router/test_routing, this benchmark scores
  #   simple -0.1   short_explanation -0.1   architecture 0.0   tradeoff 0.175
  # so the router sends all four to the cheap model. Under these defaults the
  # gateway behaves as "always cheap" on this workload.
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Complexity router using LiteLLM's built-in heuristic scorer.
  # Same aliases and tiers across every config, so benchmark.py measures the same
  # thing on each path. The alias name jev-router is a legacy label: the
  # classifier behind it here is `heuristic`, not Jev.
  - model_name: jev-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: gemini-flash
      complexity_router_config:
        tiers:
          SIMPLE: gemini-flash-lite
          MEDIUM: gemini-flash-lite
          COMPLEX: gemini-flash
          REASONING: gemini-flash
        classifier_type: heuristic
        classifier_fallback: heuristic
        classifier_context_window_size: 3
        classifier_context_budget_chars: 8000
        classifier_context_include_assistant_turns: false
        return_raw_model_name: true
        # No custom_technical_keywords, deliberately. A candidate list derived
        # from the benchmark prompts had support in one prompt each and appears
        # nowhere else, so it would not generalise. tools/check_keywords.py
        # enforces the guard; ten of the twelve candidates had support in exactly
        # one tuning prompt and two had none.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
