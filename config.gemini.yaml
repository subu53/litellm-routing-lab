model_list:
  # Free path using Google AI Studio (Gemini API). No billing account required.
  #
  # Verified against a live key: gemini-3.5-flash responds on the free tier.
  # The challenge's other model, gemini-3.5-flash-lite, does not exist - the
  # Flash-Lite line is at 3.1, so that is used for the cheap tier.
  #
  # Tier boundaries are left at the shipped defaults (0.15 / 0.35 / 0.60).
  # Lowering medium_complex to 0.25 was measured to be harmful: the heuristic
  # scorer rates reasoning prompts around 0.175, which sits ABOVE a 0.10 boundary
  # and BELOW a 0.25 boundary, so a lowered boundary pulls a mid-range score DOWN
  # into the cheap tier. At the default 0.35 the same prompt reaches COMPLEX and
  # is served by the strong model. Do not tune these without measuring first.
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Complexity router using LiteLLM's built-in heuristic scorer.
  # Same aliases and tiers across every config, so benchmark.py measures the
  # same thing on each path.
  - model_name: jev-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: gemini-flash
      complexity_router_config:
        tiers:
          SIMPLE: gemini-flash-lite
          MEDIUM: gemini-flash-lite
          COMPLEX: gemini-flash
          REASONING: gemini-flash
        classifier_type: heuristic
        classifier_fallback: heuristic
        classifier_context_window_size: 3
        classifier_context_budget_chars: 8000
        classifier_context_include_assistant_turns: false
        return_raw_model_name: true
        # Measured with POST /auto_router/test_routing: the shipped scorer gave
        # this benchmark 1/4 tier accuracy. "Design a resilient event-driven order
        # pipeline..." scored 0.0 with NO signals -- the built-in technical list
        # does not contain architecture vocabulary, so the technicalTerms dimension
        # (weight 0.25) never fires and the score collapses toward zero. Boundary
        # tuning cannot repair a score of 0.0, so domain vocabulary is appended
        # here instead. custom_technical_keywords adds to the built-in list rather
        # than replacing it.
        custom_technical_keywords:
          - event-driven
          - idempotency
          - idempotent
          - observability
          - pipeline
          - retries
          - ordering
          - failure isolation
          - synchronous
          - latency
          - trade-off
          - tradeoff

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
