model_list:
  # Cheap tier: small fast model, mirrors the role of a Flash-Lite model.
  # Model IDs verified against Groq's live catalogue: Llama models are not
  # available on this account, so the gpt-oss ladder is used instead.
  - model_name: gemini-flash-lite
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # Strong tier: larger model, mirrors the role of a full Flash model.
  - model_name: gemini-flash
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # Complexity router using LiteLLM's built-in heuristic scorer.
  # No third-party classifier, no API key, no cost, sub-millisecond.
  - model_name: jev-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: gemini-flash
      complexity_router_config:
        tiers:
          SIMPLE: gemini-flash-lite
          MEDIUM: gemini-flash-lite
          COMPLEX: gemini-flash
          REASONING: gemini-flash
        classifier_type: heuristic
        # Fall back to the scorer itself, not to one fixed model: a fallback to
        # default_model would send every undecidable prompt to the strong tier
        # and hide scorer failures.
        classifier_fallback: heuristic
        classifier_context_window_size: 3
        classifier_context_budget_chars: 8000
        classifier_context_include_assistant_turns: false
        return_raw_model_name: true
        # Lowered from the defaults (0.15 / 0.35 / 0.60) because the scorer rated
        # every benchmark prompt below the MEDIUM boundary, sending all four to the
        # cheap tier. These boundaries let genuinely harder prompts escalate.
        tier_boundaries:
          simple_medium: 0.10
          medium_complex: 0.25
          complex_reasoning: 0.45

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
